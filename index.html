<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Elemental Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#1b1730;--panel:#2a2547;--ink:#f3ecdd;--dim:#a59fc0;--c:#3aa8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#0e0b1a;color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:720px;height:360px;background:var(--bg);overflow:hidden;transform-origin:center}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px 28px;text-align:center;gap:10px}
.screen.on{display:flex}
h1,h2{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;margin:0}
h1{font-size:40px;line-height:1}
h2{font-size:26px}
p{margin:0;color:var(--dim);font-size:15px;line-height:1.4}
.btn{border:0;border-radius:16px;padding:14px 22px;background:var(--c);color:#1b1730;font-family:'Lilita One',system-ui;font-size:20px;width:100%}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.5}
input{width:100%;padding:14px;border-radius:16px;border:2px solid #ffffff22;background:var(--panel);color:var(--ink);font-family:'Lilita One',system-ui;font-size:26px;text-align:center;letter-spacing:8px;text-transform:uppercase;-webkit-user-select:text;user-select:text;touch-action:auto}
#err{color:#ff8a8a;min-height:18px;font-size:14px}
#code{font-family:'Lilita One',system-ui;font-size:54px;letter-spacing:10px;color:var(--ink)}
#lobby{flex-direction:row;gap:36px}
.col{display:flex;flex-direction:column;gap:10px;flex:1;align-items:center;max-width:300px}
#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.card{--c:#fff;border:2px solid var(--c);border-radius:20px;background:var(--panel);color:var(--ink);padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit}
.card .ic{font-size:44px;line-height:1.1}
.card b{font-family:'Lilita One',system-ui;font-weight:400;font-size:22px}
.card i{font-style:normal;font-size:12px;color:var(--dim)}
.card.mine{background:color-mix(in srgb,var(--c) 30%,var(--panel))}
.card.taken{border-style:dashed;border-color:#ffffff33}
.card:disabled{opacity:.45}
.card.mine:disabled{opacity:1}
#fight{padding:0;gap:0;justify-content:flex-start}
canvas{width:720px;height:360px;display:block}
#controls{position:absolute;left:0;right:0;bottom:0;height:84px;padding:0 14px 12px;display:none;justify-content:space-between;align-items:stretch}
#controls .g{display:flex;gap:8px}
.cb{border:0;border-radius:16px;background:var(--panel);color:var(--ink);font-family:'Lilita One',system-ui;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #ffffff22}
.cb small{font-family:system-ui;font-size:10px;color:var(--dim)}
#bb,#bf{width:62px;font-size:26px}
#bj{width:72px}
#bp{width:98px;background:var(--c);color:#1b1730;font-size:20px}
#bp small{color:#1b1730aa}
#bs{width:82px}
#bu{width:82px;background:linear-gradient(to top,#ffd16688 var(--p,0%),var(--panel) var(--p,0%))}
.cb.ready{box-shadow:inset 0 0 0 3px var(--c)}
.cb.down{transform:scale(.94);filter:brightness(1.2)}
.cb.off{opacity:.45}
#cdnum{position:absolute;left:0;right:0;top:28%;text-align:center;font-family:'Lilita One',system-ui;font-size:80px;pointer-events:none;display:none;text-shadow:0 4px 20px #000a}
#over{position:absolute;inset:0;background:#0e0b1acc;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
#over.on{display:flex}
#over .btn{width:240px}
#rotate{position:fixed;inset:0;z-index:9;background:#0e0b1a;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-family:'Lilita One',system-ui;font-size:26px;color:#f3ecdd}
</style>
</head>
<body>
<div id="rotate">Rotate your phone sideways to play</div>
<div id="stage">

  <div id="lobby" class="screen on">
    <div class="col">
      <h1>Elemental Duel</h1>
      <p>Two phones, one arena. Open this page on both.</p>
      <button class="btn" id="create">Create duel</button>
    </div>
    <div class="col">
      <p>Or join your friend</p>
      <input id="codein" maxlength="4" placeholder="CODE" autocomplete="off">
      <button class="btn alt" id="joinbtn">Join duel</button>
      <div id="err"></div>
    </div>
  </div>

  <div id="wait" class="screen">
    <p>Tell your friend this code</p>
    <div id="code">----</div>
    <button class="btn alt" id="copy" style="width:260px">Copy invite link</button>
    <p>Waiting for your friend to join…</p>
  </div>

  <div id="select" class="screen">
    <h2>Choose your fighter</h2>
    <div id="cards"></div>
    <p id="selmsg"></p>
  </div>

  <div id="fight" class="screen">
    <canvas id="cv" width="720" height="360"></canvas>
    <div id="cdnum"></div>
    <div id="controls">
      <div class="g">
        <button class="cb" id="bb">◀</button>
        <button class="cb" id="bf">▶</button>
        <button class="cb" id="bj">Jump</button>
      </div>
      <div class="g">
        <button class="cb" id="bp">Punch<small>tap again: kick</small></button>
        <button class="cb" id="bs">Special</button>
        <button class="cb" id="bu">Ultimate</button>
      </div>
    </div>
    <div id="over">
      <h2 id="otitle"></h2>
      <p id="osub"></p>
      <button class="btn" id="rematch">Rematch</button>
    </div>
  </div>

  <div id="gone" class="screen">
    <h2>Connection ended</h2>
    <p>Your friend left or the connection dropped.</p>
    <button class="btn" style="width:240px" onclick="location.href=location.pathname">Back to start</button>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const F = [
  {name:'Water', icon:'💧', c:'#3aa8ff'},
  {name:'Fire',  icon:'🔥', c:'#ff6a3d'},
  {name:'Wind',  icon:'🌪️', c:'#7ee6c4'},
  {name:'Soil',  icon:'🪨', c:'#b9824a'}
];
const ULTN = ['Tidal Wave','Tank Strike','Twister','Forest Grip'];
const SP = [ /* special moves, one per element */
  {k:'wj',   v:560, y:46, r:10, dmg:9,  kb:120, st:200},
  {k:'fb',   v:340, y:24, r:15, dmg:12, kb:160, st:280},
  {k:'gust', v:300, y:66, r:40, dmg:7,  kb:300, st:300},
  {k:'rock', v:300, y:42, r:18, dmg:14, kb:180, st:300}
];
const PRE = 'eduel1-', GY = 255;

function fit(){
  const s = Math.min(innerWidth/720, innerHeight/360);
  $('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
  $('rotate').style.display = innerHeight > innerWidth ? 'flex' : 'none';
}
addEventListener('resize', fit); fit();

/* ---------- state ---------- */
let peer, conn, isHost = false, me = 0, phase = 'lobby';
let picks = [null,null], fighters = [null,null], pend = false;
let G = null, tickId = null, lastT = 0;
const blankF = x => ({x, y:0, hp:100, a:0, ch:0, sp:false, u:false, s:false, r:false});
let V = {f:[blankF(150), blankF(570)], e:[]};
let D = {f:[{x:150,y:0,hp:100,lx:150},{x:570,y:0,hp:100,lx:570}], e:{}};
let parts = [], texts = [], shake = 0, banner = null;
const X = x => me === 0 ? x : 720 - x;   /* each phone shows itself on the left */

function show(id){ document.querySelectorAll('.screen').forEach(e => e.classList.toggle('on', e.id === id)); }
function err(msg){ $('err').textContent = msg; $('create').disabled = false; $('joinbtn').disabled = false; show('lobby'); phase = 'lobby'; }
function send(m){ if (conn && conn.open) conn.send(m); }

/* ---------- connection ---------- */
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
function randCode(){ let s=''; for(let i=0;i<4;i++) s += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return s; }

function create(tries = 0){
  $('create').disabled = true; $('err').textContent = '';
  const code = randCode();
  peer = new Peer(PRE + code);
  peer.on('open', () => { $('code').textContent = code; phase = 'wait'; show('wait'); });
  peer.on('error', e => {
    if (e.type === 'unavailable-id' && tries < 5) { peer.destroy(); create(tries+1); }
    else err('Could not start a duel (' + e.type + '). Try again.');
  });
  peer.on('connection', c => {
    if (conn) { c.close(); return; }
    conn = c; isHost = true; me = 0;
    wire(() => resetSelect());
  });
}
function join(code){
  code = (code||'').toUpperCase().trim();
  if (code.length !== 4) { $('err').textContent = 'Enter the 4-letter code.'; return; }
  $('err').textContent = 'Connecting…'; $('joinbtn').disabled = true; $('create').disabled = true;
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect(PRE + code, {reliable:true});
    isHost = false; me = 1;
    wire(() => {});
    setTimeout(() => { if (conn && !conn.open && phase === 'lobby') err('Could not connect. Check the code and try again.'); }, 10000);
  });
  peer.on('error', e => err(e.type === 'peer-unavailable' ? 'No duel found with that code.' : 'Connection error (' + e.type + ').'));
}
function wire(onOpen){
  conn.on('data', onData);
  conn.on('close', () => { if (phase !== 'lobby') { clearInterval(tickId); show('gone'); } });
  if (conn.open) onOpen(); else conn.on('open', onOpen);
}

/* ---------- messages ---------- */
function onData(m){
  switch (m.t){
    case 'pick':    if (isHost && !pick(1, m.f)) broadcastSel(); break;
    case 'in':      if (isHost) applyInput(1, m.k, m.d); break;
    case 'rematch': if (isHost) resetSelect(); break;
    case 'sel':     picks = m.picks; pend = false; if (phase !== 'select') goSelect(); renderSelect(); break;
    case 'cd':      cdShow(m.n); break;
    case 's':       V = m; break;
    case 'ev':      handleEv(m); break;
    case 'end':     onEnd(m.w); break;
  }
}

/* ---------- select ---------- */
function goSelect(){
  phase = 'select'; $('over').classList.remove('on'); $('controls').style.display = 'none';
  $('cdnum').style.display = 'none'; show('select');
}
function resetSelect(){
  clearInterval(tickId); G = null; picks = [null,null]; pend = false;
  goSelect(); broadcastSel(); renderSelect();
}
function broadcastSel(){ send({t:'sel', picks}); }
function pick(i, f){
  if (picks[i] !== null || picks.includes(f)) return false;
  picks[i] = f; broadcastSel(); renderSelect();
  if (picks[0] !== null && picks[1] !== null) setTimeout(startCountdown, 900);
  return true;
}
function choose(k){
  if (isHost) pick(0, k);
  else { pend = true; send({t:'pick', f:k}); renderSelect(); }
}
function renderSelect(){
  const box = $('cards'); box.innerHTML = '';
  F.forEach((f,k) => {
    const o = picks.indexOf(k), b = document.createElement('button');
    b.className = 'card' + (o === me ? ' mine' : o >= 0 ? ' taken' : '');
    b.style.setProperty('--c', f.c);
    b.innerHTML = `<span class="ic">${f.icon}</span><b>${f.name}</b><i>${o===me?'Yours':o>=0?'Taken':'Tap to pick'}</i>`;
    b.disabled = o >= 0 || picks[me] !== null || pend;
    b.onclick = () => choose(k);
    box.appendChild(b);
  });
  $('selmsg').textContent =
    picks[me] === null ? 'Pick one. Your friend cannot pick the same fighter.' :
    picks[1-me] === null ? 'Locked in. Waiting for your friend…' : 'Both ready. Get set!';
}

/* ---------- countdown ---------- */
function startCountdown(){
  let n = 3;
  const step = () => {
    send({t:'cd', n}); cdShow(n);
    if (n === 0) { beginFight(); return; }
    n--; setTimeout(step, 1000);
  };
  step();
}
function enterFight(){
  fighters = picks.slice();
  V = {f:[blankF(150), blankF(570)], e:[]};
  D = {f:[{x:150,y:0,hp:100,lx:150},{x:570,y:0,hp:100,lx:570}], e:{}};
  parts = []; texts = []; banner = null; held.b = held.f = false; lastMv = 0;
  $('stage').style.setProperty('--c', F[fighters[me]].c);
  $('over').classList.remove('on'); $('controls').style.display = 'none';
  show('fight');
}
function cdShow(n){
  if (phase !== 'cd' && phase !== 'fight') enterFight();
  phase = 'cd';
  const el = $('cdnum'); el.style.display = 'block'; el.textContent = n > 0 ? n : 'Fight!';
  if (n === 0) {
    phase = 'fight'; $('controls').style.display = 'flex';
    setTimeout(() => { if (phase === 'fight') el.style.display = 'none'; }, 700);
  }
}

/* ---------- host simulation (host phone decides everything) ---------- */
const dir = i => i === 0 ? 1 : -1;      /* world direction toward the opponent */
const r1 = v => Math.round(v*10)/10;
const later = (at, fn) => G.pend.push({at, fn});
const rm = e => { G.e = G.e.filter(x => x !== e); };

function mk(i){ return {x:i?570:150, y:0, vy:0, kx:0, hp:100, mv:0, a:0, aUntil:0, stun:0, root:0,
                        ch:0, ult:false, spAt:0, lastP:0, lastKind:0, cdUntil:0}; }
function beginFight(){
  const now = performance.now();
  G = {f:[mk(0), mk(1)], e:[], pend:[], eid:0, over:false};
  G.f.forEach(f => f.spAt = now + 4000 + Math.random()*2000);
  lastT = now; clearInterval(tickId); tickId = setInterval(loop, 33);
}
function ev(m){ m.t = 'ev'; send(m); handleEv(m); }

function damage(t, dmg, kb, stunMs, big, raise){
  const now = performance.now(), f = G.f[t], a = G.f[1-t];
  f.hp = Math.max(0, f.hp - dmg);
  f.kx += (t === 0 ? -1 : 1) * kb;
  if (stunMs > 0){ f.stun = Math.max(f.stun, now + stunMs); f.a = 0; }
  if (raise){ f.vy = raise; }
  f.ch = Math.min(100, f.ch + 6); a.ch = Math.min(100, a.ch + 8);
  ev({k:'hit', i:t, d:Math.round(dmg), big:!!big, x:r1(f.x), y:r1(f.y)});
}

function loop(){
  if (!G || G.over) return;
  const now = performance.now(), dt = Math.min(.1, (now - lastT)/1000); lastT = now;

  for (const p of G.pend.slice()){ if (now >= p.at){ G.pend.splice(G.pend.indexOf(p),1); p.fn(); } }

  for (let i=0;i<2;i++){
    const f = G.f[i], can = now >= f.stun, free = can && now >= f.root;
    if (now > f.aUntil) f.a = 0;
    const vx = free ? f.mv * dir(i) * 190 : 0;
    f.x += (vx + f.kx) * dt; f.kx *= Math.pow(.02, dt);
    if (f.y > 0 || f.vy > 0){ f.vy -= 1700*dt; f.y += f.vy*dt; if (f.y <= 0){ f.y = 0; f.vy = 0; } }
    if (!f.ult) f.ch = Math.min(100, f.ch + 2.5*dt);
  }
  /* keep fighters on the arena and apart */
  const [a,b] = G.f;
  a.x = Math.max(34, Math.min(686, a.x)); b.x = Math.max(34, Math.min(686, b.x));
  const ov = a.x - (b.x - 44);
  if (ov > 0){ a.x -= ov/2; b.x += ov/2; a.x = Math.max(34,a.x); b.x = Math.min(686,b.x); }

  for (const e of G.e.slice()){
    e.age += dt*1000;
    if (e.k === 'tree' && e.age < 450) e.x = G.f[1-e.o].x + e.side*28;
    if (!e.vx) continue;
    e.x += e.vx*dt;
    if (e.x < -80 || e.x > 800){ rm(e); continue; }
    const t = 1 - e.o, f = G.f[t];
    if (!e.hit && f.hp > 0 && Math.abs(e.x - f.x) < e.r + 22 && Math.abs(e.y - (f.y + 55)) < e.r + 55){
      if (e.pierce) e.hit = true; else rm(e);
      damage(t, e.dmg, e.kb, e.st, e.big || e.r >= 30, e.raise);
      if (e.k === 'boulder') clearTrees(e.o);
    }
  }

  send(snapshot());
  if (G.f[0].hp <= 0 || G.f[1].hp <= 0){
    G.over = true; clearInterval(tickId);
    const w = (G.f[0].hp <= 0 && G.f[1].hp <= 0) ? -1 : (G.f[0].hp <= 0 ? 1 : 0);
    send({t:'end', w}); onEnd(w);
  }
}
function snapshot(){
  const now = performance.now();
  V = {t:'s',
    f: G.f.map(f => ({x:r1(f.x), y:r1(f.y), hp:r1(f.hp), a:f.a, ch:Math.round(f.ch), sp:now >= f.spAt, u:f.ult, s:now < f.stun, r:now < f.root})),
    e: G.e.map(e => ({id:e.id, k:e.k, o:e.o, x:r1(e.x), y:r1(e.y), r:e.r||0, a:Math.round(e.age)}))};
  return V;
}

function proj(i, o){
  const f = G.f[i], d = dir(i);
  const e = Object.assign({id:++G.eid, o:i, x:f.x + d*40, age:0}, o);
  e.y = (o.y || 40) + f.y; e.vx = d * o.v; G.e.push(e); return e;
}
function clearTrees(o){ G.e = G.e.filter(x => !(x.k === 'tree' && x.o === o)); G.f[1-o].root = 0; }

function doMelee(i){
  const now = performance.now(), f = G.f[i];
  if (now < f.stun || now < f.cdUntil) return;
  const kick = f.lastKind === 1 && now - f.lastP < 650;
  f.lastKind = kick ? 2 : 1; f.lastP = now;
  f.a = kick ? 2 : 1; f.aUntil = now + (kick ? 320 : 240); f.cdUntil = now + (kick ? 420 : 260);
  later(now + 110, () => {
    const o = G.f[1-i];
    if (performance.now() < f.stun) return;
    if (Math.abs(o.x - f.x) < 78 && Math.abs(o.y - f.y) < 50)
      damage(1-i, kick ? 10 : 6, kick ? 200 : 90, kick ? 380 : 230, kick);
  });
}
function doSpecial(i){
  const now = performance.now(), f = G.f[i];
  if (now < f.stun || now < f.spAt) return;
  f.spAt = now + 4000 + Math.random()*2000;
  f.a = 3; f.aUntil = now + 350;
  later(now + 150, () => proj(i, SP[fighters[i]]));
}
function doUlt(i){
  const now = performance.now(), f = G.f[i], d = dir(i), o = G.f[1-i];
  if (now < f.stun || f.ult || f.ch < 100) return;
  f.ult = true; f.ch = 0; f.a = 4; f.aUntil = now + 700;
  ev({k:'ult', i});
  const el = fighters[i];
  if (el === 0){        /* water: tidal wave */
    later(now + 300, () => proj(i, {k:'wave', v:360, y:70, r:70, dmg:24, kb:480, st:600, pierce:true, big:true}));
  } else if (el === 2){ /* wind: twister that flings */
    later(now + 300, () => proj(i, {k:'tor', v:230, y:60, r:45, dmg:20, kb:420, st:900, raise:540, big:true}));
  } else if (el === 1){ /* fire: tank */
    const tk = {id:++G.eid, k:'tank', o:i, x:Math.max(40, Math.min(680, f.x - d*90)), y:0, age:0};
    G.e.push(tk);
    const shell = big => { if (!G.e.includes(tk)) return;
      const e = proj(i, {k:'fb', v:big?460:420, y:50, r:big?30:14, dmg:big?20:7, kb:big?720:150, st:big?700:250, big});
      e.x = tk.x + d*50; e.y = 50; };
    [700,1100,1500].forEach(t => later(now + t, () => shell(false)));
    later(now + 2100, () => shell(true));
    later(now + 2900, () => rm(tk));
  } else {              /* soil: trees grab, boulder follows */
    [-1,1].forEach(side => G.e.push({id:++G.eid, k:'tree', o:i, side, x:o.x + side*28, y:0, age:0}));
    later(now + 450, () => { o.root = performance.now() + 3000; });
    [900,1400,1900].forEach(t => later(now + t, () => {
      if (G.e.some(x => x.k === 'tree' && x.o === i)) damage(1-i, 3, 0, 0, false); }));
    later(now + 1200, () => proj(i, {k:'boulder', v:480, y:60, r:34, dmg:26, kb:520, st:700, big:true}));
    later(now + 3000, () => clearTrees(i));
  }
}
function applyInput(i, k, d){
  if (!G || G.over) return;
  const f = G.f[i];
  if (k === 'mv') f.mv = d;
  else if (k === 'j'){ const now = performance.now(); if (f.y === 0 && now >= f.stun && now >= f.root) f.vy = 500; }
  else if (k === 'p') doMelee(i);
  else if (k === 's') doSpecial(i);
  else if (k === 'u') doUlt(i);
}

/* ---------- effects ---------- */
function spawn(x, y, col, n, spd){
  for (let k=0;k<n;k++){
    const a = Math.random()*Math.PI*2, s = (.4+Math.random())*spd;
    parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 1.5, l:1, c:col, r:2+Math.random()*3});
  }
}
function handleEv(m){
  const now = performance.now();
  if (m.k === 'hit'){
    const x = X(m.x), y = GY - m.y - 55, col = F[fighters[m.i]].c;
    spawn(x, y, '#d1002f', m.big ? 34 : 18, m.big ? 6 : 4.5);
    spawn(x, y, col, m.big ? 12 : 6, 4);
    shake = Math.max(shake, m.big ? 14 : (m.i === me ? 7 : 4));
    texts.push({x:x + (Math.random()*30-15), y:y-50, s:'-' + m.d, c:'#ff5b6e', t0:now});
  } else if (m.k === 'ult'){
    banner = {s:ULTN[fighters[m.i]], c:F[fighters[m.i]].c, t0:now};
  }
}
function onEnd(w){
  phase = 'over'; $('controls').style.display = 'none';
  setTimeout(() => {
    if (phase !== 'over') return;
    $('otitle').textContent = w === -1 ? 'Draw' : w === me ? 'You win!' : 'You lose';
    $('osub').textContent = w === -1 ? 'Both fighters fell together.' :
      `${F[fighters[w]].name} ${w === me ? 'stands victorious' : 'wins this round'}.`;
    $('over').classList.add('on');
  }, 800);
}

/* ---------- input ---------- */
let lastMv = 0; const held = {b:false, f:false};
function sendInput(k, d){
  if (phase !== 'fight') return;
  if (isHost) applyInput(0, k, d); else send({t:'in', k, d});
}
function updMv(){ const v = (held.f?1:0) - (held.b?1:0); if (v !== lastMv){ lastMv = v; sendInput('mv', v); } }
function holdBtn(btn, key){
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); btn.classList.add('down'); held[key] = true; updMv(); });
  const off = () => { btn.classList.remove('down'); held[key] = false; updMv(); };
  btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off);
}
function tapBtn(btn, k){
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('down'); sendInput(k); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => btn.addEventListener(ev, () => btn.classList.remove('down')));
}
holdBtn($('bb'), 'b'); holdBtn($('bf'), 'f');
tapBtn($('bj'), 'j'); tapBtn($('bp'), 'p'); tapBtn($('bs'), 's'); tapBtn($('bu'), 'u');
const KEYS = {ArrowLeft:'b', a:'b', ArrowRight:'f', d:'f'};
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (KEYS[e.key]){ held[KEYS[e.key]] = true; updMv(); }
  else if (e.key === 'ArrowUp' || e.key === 'w') sendInput('j');
  else if (e.key === 'j') sendInput('p'); else if (e.key === 'k') sendInput('s'); else if (e.key === 'l') sendInput('u');
});
addEventListener('keyup', e => { if (KEYS[e.key]){ held[KEYS[e.key]] = false; updMv(); } });

$('create').onclick = () => create();
$('joinbtn').onclick = () => join($('codein').value);
$('rematch').onclick = () => { if (isHost) resetSelect(); else send({t:'rematch'}); };
$('copy').onclick = async () => {
  const url = location.origin + location.pathname + '?join=' + $('code').textContent;
  try { await navigator.clipboard.writeText(url); $('copy').textContent = 'Copied'; }
  catch (e) { prompt('Copy this link', url); }
};

/* ---------- drawing ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
const FONT = s => `${s}px "Lilita One",system-ui,sans-serif`;
const line = (x1,y1,x2,y2) => { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
const disc = (x,y,r) => { ctx.beginPath(); ctx.arc(x,y,Math.max(0,r),0,7); ctx.fill(); };

function figure(x, y, f, dir, p, t){
  ctx.save(); ctx.translate(x, y);
  const gr = ctx.createRadialGradient(0,0,10,0,0,80);
  gr.addColorStop(0, f.c + '55'); gr.addColorStop(1, f.c + '00');
  ctx.fillStyle = gr; disc(0,0,80);
  const col = p.flash ? '#fff' : f.c;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 7; ctx.lineCap = 'round';
  const ph = p.mv ? Math.sin(t/80)*16 : 0;
  if (p.air){ line(0,12,-12,38); line(0,12,14,40); }
  else if (p.a === 2){ line(0,12,-dir*10,52); line(0,12,dir*54,20); }
  else { line(0,12,-14+ph,52); line(0,12,14-ph,52); }
  line(0,-34,0,12);
  if (p.a === 1){ line(0,-26,dir*40,-30); line(0,-26,-dir*14,-10); }
  else if (p.a === 3){ line(0,-26,dir*36,-32); line(0,-26,dir*32,-18); }
  else if (p.a === 4){ line(0,-26,-14,-66); line(0,-26,14,-66); }
  else { line(0,-26,-22+ph*.5,2); line(0,-26,22-ph*.5,2); }
  disc(0,-50,13);
  ctx.font = '16px system-ui'; ctx.textAlign = 'center'; ctx.fillText(f.icon, 0, -4);
  ctx.restore();
}

function drawEnt(e, d, t){
  const x = X(d.x), y = GY - d.y, ds = e.o === me ? 1 : -1;
  ctx.save();
  switch (e.k){
    case 'wj':
      for (let k=5;k>=0;k--){ ctx.globalAlpha = .75 - k*.1; ctx.fillStyle = '#3aa8ff'; disc(x - ds*k*11, y, e.r*(1 - k*.1)); }
      ctx.globalAlpha = 1; ctx.fillStyle = '#e8f6ff'; disc(x, y, 4); break;
    case 'fb': {
      const r = e.r * (1 + .15*Math.sin(t/45));
      for (let k=5;k>=1;k--){ ctx.globalAlpha = .55 - k*.08; ctx.fillStyle = '#ff6a3d'; disc(x - ds*k*r*.55, y, r*(1 - k*.12)); }
      ctx.globalAlpha = 1; ctx.shadowColor = '#ff6a3d'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff6a3d'; disc(x, y, r);
      ctx.shadowBlur = 0; ctx.fillStyle = '#ffd166'; disc(x, y, r*.55); break; }
    case 'gust':
      ctx.strokeStyle = '#7ee6c4'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      for (let k=0;k<3;k++){ ctx.globalAlpha = .9 - k*.2; ctx.beginPath();
        ctx.ellipse(x - ds*k*14, y + (k-1)*26, 12, 22, Math.sin(t/120 + k)*.5, 0, 7); ctx.stroke(); }
      break;
    case 'rock': case 'boulder': {
      ctx.translate(x, y); ctx.rotate(t/160*ds);
      ctx.fillStyle = '#b9824a'; disc(0, 0, e.r);
      ctx.fillStyle = '#7a5128'; disc(e.r*.3, -e.r*.2, e.r*.25); disc(-e.r*.35, e.r*.25, e.r*.2);
      ctx.strokeStyle = '#7a5128'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,0,e.r,0,7); ctx.stroke(); break; }
    case 'wave': {
      const h = 140, w = 90;
      ctx.fillStyle = '#3aa8ffcc'; ctx.beginPath(); ctx.moveTo(x - ds*w*.6, GY);
      ctx.quadraticCurveTo(x - ds*w*.6, GY - h, x + ds*w*.5, GY - h*.8);
      ctx.quadraticCurveTo(x + ds*w*.05, GY - h*.55, x + ds*w*.5, GY); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffffcc'; disc(x + ds*w*.4, GY - h*.8, 7); disc(x + ds*w*.15, GY - h*.7, 5); break; }
    case 'tor':
      for (let k=0;k<7;k++){ ctx.globalAlpha = .7; ctx.strokeStyle = '#7ee6c4'; ctx.fillStyle = '#7ee6c433'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(x + Math.sin(t/110 + k)*9, GY - 8 - k*19, 12 + k*5, 6, 0, 0, 7); ctx.fill(); ctx.stroke(); }
      break;
    case 'tank': {
      const g = Math.min(1, e.a/250);
      ctx.translate(x, GY); ctx.scale(g, g);
      ctx.fillStyle = '#2a2547'; ctx.beginPath(); ctx.roundRect(-44,-18,88,18,9); ctx.fill();
      ctx.fillStyle = '#a14a2a'; ctx.fillRect(-34,-38,68,22);
      ctx.fillStyle = '#d9582f'; ctx.beginPath(); ctx.roundRect(-16,-56,36,20,6); ctx.fill();
      ctx.strokeStyle = '#4a3a52'; ctx.lineWidth = 8; ctx.lineCap = 'round'; line(0,-46, ds*58,-46);
      if (e.a > 600 && (e.a % 400) < 90){ ctx.fillStyle = '#ffd166'; disc(ds*62,-46,10); }
      break; }
    case 'tree': {
      const g = Math.min(1, e.a/400), tx = X(D.f[1-e.o].x), bd = Math.sign(tx - x) || 1;
      ctx.fillStyle = '#6b4423'; ctx.fillRect(x - 8, GY - 120*g, 16, 120*g);
      ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      line(x, GY - 90*g, x + bd*36, GY - 62*g); line(x, GY - 60*g, x + bd*30, GY - 36*g);
      ctx.fillStyle = '#4f9d4f'; disc(x, GY - 128*g, 30*g); disc(x - 20*g, GY - 112*g, 20*g); disc(x + 20*g, GY - 112*g, 20*g);
      break; }
  }
  ctx.restore();
}

function bar(x, y, w, h, v, col){
  ctx.fillStyle = '#ffffff1a'; ctx.beginPath(); ctx.roundRect(x,y,w,h,h/2); ctx.fill();
  const ww = Math.max(0, Math.min(1, v/100)) * w;
  if (ww > 1){ ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x,y,ww,h,h/2); ctx.fill(); }
}
function hud(i){
  const f = F[fighters[i]], x = i === me ? 20 : 390, w = 310, s = V.f[i];
  ctx.textAlign = 'left'; ctx.fillStyle = '#f3ecdd'; ctx.font = FONT(16);
  ctx.fillText((i === me ? 'You' : 'Opponent') + ' · ' + f.name, x, 24);
  ctx.textAlign = 'right'; ctx.fillStyle = '#a59fc0'; ctx.font = FONT(14);
  ctx.fillText(Math.ceil(s.hp), x + w, 24);
  bar(x, 31, w, 12, D.f[i].hp, D.f[i].hp > 30 ? '#6fdc8c' : '#ff5b6e');
  bar(x, 47, w, 6, s.u ? 0 : s.ch, '#ffd166');
}

function draw(){
  requestAnimationFrame(draw);
  if (fighters[0] === null || fighters[1] === null || !$('fight').classList.contains('on')) return;
  const now = performance.now();

  for (let i=0;i<2;i++){ const t = V.f[i], d = D.f[i];
    d.lx = d.x; d.x += (t.x - d.x)*.45; d.y += (t.y - d.y)*.5; d.hp += (t.hp - d.hp)*.18; }
  const live = {};
  for (const e of V.e){ let d = D.e[e.id]; if (!d) d = D.e[e.id] = {x:e.x, y:e.y};
    d.x += (e.x - d.x)*.5; d.y += (e.y - d.y)*.5; live[e.id] = 1; }
  for (const id in D.e) if (!live[id]) delete D.e[id];

  ctx.save(); ctx.clearRect(0,0,720,360);
  if (shake > 0){ ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= .86; if (shake < .5) shake = 0; }

  const g = ctx.createLinearGradient(0,0,0,GY);
  g.addColorStop(0,'#2a2050'); g.addColorStop(1,'#1b1730');
  ctx.fillStyle = g; ctx.fillRect(-20,-20,760,GY+20);
  ctx.fillStyle = '#2c2142'; ctx.fillRect(-20,GY,760,120);
  ctx.fillStyle = '#ffffff18'; ctx.fillRect(-20,GY,760,3);

  const back = V.e.filter(e => e.k === 'tank' || e.k === 'tree'), front = V.e.filter(e => !(e.k === 'tank' || e.k === 'tree'));
  for (const e of back) drawEnt(e, D.e[e.id], now);

  for (const i of [0,1]){
    const s = V.f[i], d = D.f[i], px = X(d.x);
    ctx.fillStyle = '#00000055'; ctx.beginPath(); ctx.ellipse(px, GY+4, 34 - d.y*.12, 7, 0, 0, 7); ctx.fill();
    figure(px, GY - d.y - 52, F[fighters[i]], i === me ? 1 : -1,
      {a:s.a, air:d.y > 6, mv:Math.abs(d.x - d.lx) > .4, flash:s.s && Math.floor(now/70)%2 === 0}, now);
  }

  for (const e of front) drawEnt(e, D.e[e.id], now);

  parts = parts.filter(q => q.l > 0);
  for (const q of parts){
    q.x += q.vx; q.y += q.vy; q.vy += .2; q.l -= .028;
    ctx.globalAlpha = Math.max(0, q.l); ctx.fillStyle = q.c; disc(q.x, q.y, q.r);
  }
  ctx.globalAlpha = 1;

  texts = texts.filter(t => now - t.t0 < 900);
  ctx.textAlign = 'center'; ctx.font = FONT(22);
  for (const t of texts){ const k = (now - t.t0)/900; ctx.globalAlpha = 1 - k; ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y - k*34); }
  ctx.globalAlpha = 1;

  hud(me); hud(1 - me);
  if (banner && now - banner.t0 < 1500){
    const k = (now - banner.t0)/1500;
    ctx.globalAlpha = k < .7 ? 1 : 1 - (k-.7)/.3; ctx.fillStyle = banner.c; ctx.font = FONT(38); ctx.textAlign = 'center';
    ctx.fillText(banner.s, 360, 110); ctx.globalAlpha = 1;
  }
  ctx.restore();

  const m = V.f[me], lv = phase === 'fight';
  $('bs').classList.toggle('ready', lv && m.sp); $('bs').classList.toggle('off', !lv || !m.sp);
  const uOk = lv && !m.u && m.ch >= 100;
  $('bu').style.setProperty('--p', (m.u ? 0 : m.ch) + '%');
  $('bu').classList.toggle('ready', uOk); $('bu').classList.toggle('off', !uOk && !(lv && !m.u));
  $('bu').firstChild.textContent = m.u ? 'Used' : 'Ultimate';
}
requestAnimationFrame(draw);

/* auto-join from invite link */
const q = new URLSearchParams(location.search).get('join');
if (q) { $('codein').value = q.toUpperCase().slice(0,4); join(q); }
</script>
